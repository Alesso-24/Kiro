<!DOCTYPE html><html lang="es"><meta charset="utf-8"><title>Alloy - evaluar animaciones</title>
<style>
body{background:#111;color:#ddd;font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
#l{width:330px;overflow:auto;padding:10px;border-right:1px solid #333;box-sizing:border-box}
#r{flex:1;padding:16px;text-align:center;overflow:auto}
h1{font-size:17px;margin:0 0 6px}h3{font-size:12px;color:#8b949e;margin:12px 0 4px;text-transform:uppercase}
button{background:#2a2a35;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;margin:2px}
button:hover{background:#3a3a48}
.i{padding:5px 8px;border-left:4px solid #2a2a35;cursor:pointer;font-size:13px;border-radius:4px}
.i:hover{background:#1b1b22}.i.sel{background:#223}
.i.s2{border-left-color:#3fb950}.i.s1{border-left-color:#d29922}.i.s0{border-left-color:#f85149}
.big{display:flex;justify-content:center;gap:20px;margin:14px 0}
.big img{width:300px;height:300px;border-radius:50%;background:#000}
.v button{font-size:16px;padding:10px 16px}
textarea{width:min(640px,90%);background:#1b1b22;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;font-size:14px}
small{color:#888}
</style>
<div id="l"><h1>Alloy: animaciones</h1><span id="cnt"></span><br>
<button onclick="exp()">Descargar JSON</button><button onclick="cp()">Copiar JSON</button>
<div id="list"></div></div>
<div id="r"><h2 id="nm">Elige una animacion de la lista</h2>
<div class="big"><img id="a"><img id="b"></div>
<div class="v"><button onclick="vote(2)">1 Me encanta</button><button onclick="vote(1)">2 Mas o menos</button><button onclick="vote(0)">3 No me gusta</button><button onclick="rp()">R repetir</button></div><br>
<textarea id="note" rows="3" placeholder="Que te gusta o que cambiarias (muy rapida, muy lenta, exagerada, rara...)" oninput="saveNote()"></textarea><br>
<small>Teclas: 1 / 2 / 3 votan y pasan a la siguiente · R repite · flechas ↑ ↓ navegan. Sin votar no cuenta.</small></div>
<script>
const ITEMS=__ITEMS__;const K='alloy_anims_v1';let V={},NT={},sel=-1,els=[];
function load(){try{V=JSON.parse(localStorage.getItem(K)||'{}');NT=JSON.parse(localStorage.getItem(K+'n')||'{}')}catch(e){}}
function cls(i){const v=V[ITEMS[i].id];return 'i'+(v!==undefined?' s'+v:'')+(i==sel?' sel':'')}
function pick(i){sel=i;const it=ITEMS[i];document.getElementById('nm').textContent=it.grupo+' · '+it.nombre;
 document.getElementById('a').src=it.imgs[0];document.getElementById('b').src=it.imgs[1];
 document.getElementById('note').value=NT[it.id]||'';els.forEach((e,k)=>e.className=cls(k));els[i].scrollIntoView({block:'nearest'})}
function rp(){if(sel<0)return;const it=ITEMS[sel];for(const [e,k] of [['a',0],['b',1]]){const x=document.getElementById(e);x.src='';x.src=it.imgs[k]+'?r='+Date.now()}}
function vote(v){if(sel<0)return;const id=ITEMS[sel].id;if(V[id]===v)delete V[id];else V[id]=v;localStorage.setItem(K,JSON.stringify(V));cnt();if(sel<ITEMS.length-1)pick(sel+1);else els[sel].className=cls(sel)}
function saveNote(){if(sel<0)return;const t=document.getElementById('note').value,id=ITEMS[sel].id;if(t)NT[id]=t;else delete NT[id];localStorage.setItem(K+'n',JSON.stringify(NT))}
function cnt(){document.getElementById('cnt').textContent=Object.keys(V).length+' / '+ITEMS.length+' votadas';els.forEach((e,k)=>e.className=cls(k))}
function data(){return JSON.stringify(ITEMS.filter(it=>V[it.id]!==undefined||NT[it.id]).map(it=>({tipo:it.id.split(':')[0],nombre:it.nombre,grupo:it.grupo,voto:V[it.id]===undefined?null:['no','mas_o_menos','me_encanta'][V[it.id]],nota:NT[it.id]||undefined})),null,1)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data()],{type:'application/json'}));a.download='alloy_animaciones.json';a.click()}
function cp(){navigator.clipboard.writeText(data()).then(()=>alert('Copiado'))}
const L=document.getElementById('list');let g='';
ITEMS.forEach((it,i)=>{if(it.grupo!==g){g=it.grupo;const h=document.createElement('h3');h.textContent=g;L.appendChild(h)}
 const e=document.createElement('div');e.textContent=it.nombre;e.onclick=()=>pick(i);L.appendChild(e);els.push(e)});
load();cnt();
document.onkeydown=e=>{if(e.target.tagName=='TEXTAREA')return;if(e.key=='1')vote(2);else if(e.key=='2')vote(1);else if(e.key=='3')vote(0);else if(e.key=='r'||e.key=='R')rp();else if(e.key=='ArrowDown'&&sel<ITEMS.length-1){pick(sel+1);e.preventDefault()}else if(e.key=='ArrowUp'&&sel>0){pick(sel-1);e.preventDefault()}};
if(ITEMS.length)pick(0);
</script></html>
