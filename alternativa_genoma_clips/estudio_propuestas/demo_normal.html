<!doctype html><html lang="es"><meta charset="utf-8"><title>Alloy · estilo tinta · Normal</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0d;display:grid;place-items:center;font:14px system-ui;color:#8a857c}
#w{text-align:center}canvas{width:min(80vmin,720px);height:min(80vmin,720px);border-radius:50%;box-shadow:0 0 0 10px #1a1a1d;display:block;margin:0 auto 18px;cursor:pointer}
</style>
<div id="w"><canvas id="c" width="480" height="480"></canvas>
<div>Alloy · estilo tinta · <b>Normal</b> — mouse = te mira · clic = otro color · espacio = parpadeo lento · E = emoción sorpresa</div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.scale(2,2);
const PAL=[['#4de3ff','#06323d'],['#ff5fa2','#3d0a22'],['#ffb02e','#3d2503'],['#8dff6a','#14340a'],['#b48cff','#240f4a'],['#ff6a4d','#3d130a'],['#f3eee3','#2a2823']];
let pi=0,col=hex(PAL[0][0]),dk=hex(PAL[0][1]),colT=col,dkT=dk;
function hex(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
let seed=1;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647-.5}
let boil=0;function wob(i,a){seed=(boil*977+i*131)%2147483646+1;return rnd()*a}
// resortes SUBAMORTIGUADOS = rebotan y se pasan de largo (vida)
const S=(x=0)=>({x,v:0,t:x});
function st(s,dt,k,d){s.v+=((s.t-s.x)*k-s.v*d)*dt;s.x+=s.v*dt}
const gx=S(),gy=S(),gx2=S(),gy2=S(),oL=S(1),oR=S(1),tilt=S(),sq=S(),pup=S(1),happy=S(),brL=S(),brR=S(),pop=S(1),droop=S();
const now=()=>performance.now()/1000;let T0=now(),mouse=null,E={blink:2,sacc:1.2,slow:16,mood:5,slowUntil:0,q:[]};
function ring(cx,cy,rx,ry,lw,id,color,fill){
  g.beginPath();for(let i=0;i<=40;i++){const a=i/40*6.2832,x=cx+Math.cos(a)*(rx+wob(id*50+i,.7)),y=cy+Math.sin(a)*(ry+wob(id*50+i+99,.7));i?g.lineTo(x,y):g.moveTo(x,y)}
  g.closePath();if(fill){g.fillStyle=fill;g.fill()}g.lineWidth=lw;g.strokeStyle=color;g.lineJoin=g.lineCap='round';g.stroke()
}
function lid(cx,cy,half,bulge,thick,id,color){
  const n=28,A=[],B=[];
  for(let i=0;i<=n;i++){const u=i/n,x=(u*2-1)*half,y=cy-bulge*Math.sin(Math.PI*u)+Math.pow(Math.abs(u*2-1),2.2)*14+wob(id*70+i,.6),w=thick*Math.pow(Math.sin(Math.PI*(.12+.76*u)),.9)+.6;A.push([cx+x,y-w/2]);B.push([cx+x,y+w/2])}
  g.beginPath();A.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));B.reverse().forEach(p=>g.lineTo(...p));g.closePath();g.fillStyle=color;g.fill()
}
function eye(cx,cy,id,o,gX,gY,br,side){
  const C=rgb(col),D=rgb(dk);o=Math.max(0,Math.min(1.12,o));
  const hp=happy.x,droopK=droop.x;
  const open_=o*(1-.32*hp)*(1-.35*droopK);
  const vel=Math.hypot(gx.v,gy.v),stretch=1+Math.min(.16,vel*.004);
  const RX=23*(1+(1-Math.min(o,1))*.35)/Math.sqrt(stretch)*pop.x,RY=35*stretch*pop.x*(.06+.94*open_);
  g.save();g.translate(cx+gX*.9,cy+gY*.9+(35-RY)*.5);g.rotate(tilt.x*(side?1:1)*.0175);
  ring(0,0,RX,RY,6,id,C,rgb(col,.16));
  if(open_>.2){const pr=11.5*pup.x;ring(gX*.5,gY*.5,pr,Math.min(21*pup.x,RY*.62),4.4,id+7,C,D);
    g.beginPath();g.ellipse(gX*.5+5,gY*.5-6,2.6,3.6,0,0,6.3);g.fillStyle=rgb(col,.9);g.fill()} // brillito de color (no blanco)
  // mejilla feliz: arco inferior que sube
  if(hp>.15){g.beginPath();g.ellipse(0,RY*.9+4,RX*1.1,10+hp*8,0,0,Math.PI);g.fillStyle='#050506';g.fill();g.beginPath();g.ellipse(0,RY*.9+4,RX*1.1,10+hp*8,0,Math.PI,6.28);g.strokeStyle='rgba(0,0,0,0)';g.stroke()}
  g.restore();
  g.save();g.translate(cx+gX*.4,0);g.rotate(tilt.x*.0175*.6);
  lid(0,cy-35-9+(35-RY)*1.25+gY*.35+droopK*8,36,13-(1-Math.min(o,1))*7,11+(1-o)*2,id+3,C);
  if(open_>.5){const b=br*9;g.beginPath();for(let i=0;i<=10;i++){const u=i/10,x=(u*2-1)*18,y=cy-35-32-b+gY*.2-Math.sin(Math.PI*u)*3.5+(side?-1:1)*(u-.5)*br*5;i?g.lineTo(x,y):g.moveTo(x,y)}
    g.lineWidth=2.6;g.strokeStyle=rgb(col,.55);g.lineCap='round';g.stroke()}
  g.restore()
}
const look=(x,y)=>{gx.t=x;gy.t=y;gx2.t=x;gy2.t=y};
function blink(){oL.t=1.1;oR.t=1.1;setTimeout(()=>{oL.t=0},50);setTimeout(()=>{oR.t=0},85);setTimeout(()=>{oL.t=1;sq.v+=2},230);setTimeout(()=>{oR.t=1},255)}
function slow(){const t=now()-T0;E.slowUntil=t+2.5;oL.t=oR.t=0;droop.t=.4;
  [.6,1.2,1.8].forEach(d=>setTimeout(()=>look((Math.random()*2-1)*16,(Math.random()*2-1)*8),d*1000));
  setTimeout(()=>{look(0,0);oL.t=1;setTimeout(()=>oR.t=1,60);droop.t=0;pop.v+=2;tilt.t=0},2100)}
function mood(kind){
  const k=kind||['curioso','feliz','sono','curioso','feliz'][Math.random()*5|0];
  if(k==='curioso'){const s=Math.random()<.5?-1:1;tilt.t=s*7;look(s*15,-5);brL.t=s>0?1:.2;brR.t=s>0?.2:1;pup.t=1.12;pop.v+=2}
  if(k==='feliz'){happy.t=1;pop.v+=3;tilt.t=(Math.random()<.5?-1:1)*4;setTimeout(()=>{happy.t=0},1800)}
  if(k==='sono'){droop.t=1;pup.t=.9;look(0,6);setTimeout(()=>{droop.t=0;pup.t=1;pop.v+=2},2200)}
  if(k==='sorpresa'){pup.t=.62;pop.t=1.12;brL.t=brR.t=1.4;oL.t=oR.t=1.1;pop.v+=4;setTimeout(()=>{pup.t=1;pop.t=1;brL.t=brR.t=0;oL.t=oR.t=1},1400)}
  if(k!=='sorpresa')setTimeout(()=>{tilt.t=0;brL.t=brR.t=0;pup.t=1;look(0,0)},1900)
}
function colorNext(){pi=(pi+1)%PAL.length;colT=hex(PAL[pi][0]);dkT=hex(PAL[pi][1]);pop.v-=6;setTimeout(()=>pop.v+=7,90)}
let last=now();
function frame(){
  const n=now(),t=n-T0,dt=Math.min(.033,n-last);last=n;boil=Math.floor(t*10);
  if(t>E.blink&&t>E.slowUntil){blink();if(Math.random()<.2)setTimeout(blink,330);E.blink=t+2+Math.random()*3.6}
  if(t>E.slow){slow();E.slow=t+24+Math.random()*18}
  if(t>E.mood&&t>E.slowUntil&&!mouse){mood();E.mood=t+6+Math.random()*6}
  if(!mouse&&t>E.sacc&&t>E.slowUntil&&Math.abs(tilt.t)<1){const r=Math.random();
    if(r<.3)look(0,0);else look((Math.random()*2-1)*17,(Math.random()*2-1)*11);E.sacc=t+1.2+Math.random()*2.6}
  if(mouse)look(mouse.x*19,mouse.y*13);
  gx.t=gx2.t;gy.t=gy2.t;
  st(gx,dt,150,9);st(gy,dt,150,9);              // cabeza: rápida y rebota
  st(oL,dt,520,28);st(oR,dt,520,28);st(tilt,dt,90,8);st(sq,dt,110,7);st(pup,dt,120,10);st(happy,dt,60,10);
  st(brL,dt,100,9);st(brR,dt,100,9);st(pop,dt,170,10);st(droop,dt,50,9);
  for(let i=0;i<3;i++){col[i]+=(colT[i]-col[i])*.12;dk[i]+=(dkT[i]-dk[i])*.12}
  g.clearRect(0,0,240,240);g.fillStyle='#050506';g.fillRect(0,0,240,240);
  const bob=Math.sin(t*1.7)*1.4+sq.x*0;g.save();g.translate(Math.sin(t*.6)*1.5+gx.x*.12,bob);
  const lagX=gx.x-gx.v*.012,lagY=gy.x-gy.v*.012;       // el ojo derecho llega un pelín después
  eye(77,126,1,oL.x,gx.x,gy.x,brL.x,0);eye(163,126,2,oR.x,lagX,lagY,brR.x,1);
  g.restore();requestAnimationFrame(frame)
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse={x:((e.clientX-r.left)/r.width-.5)*2,y:((e.clientY-r.top)/r.height-.5)*2}});
c.addEventListener('mouseleave',()=>{mouse=null;look(0,0)});
c.addEventListener('click',colorNext);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();slow()}if(e.key==='e'||e.key==='E')mood('sorpresa')});
frame();
</script></html>
