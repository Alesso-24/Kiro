<!doctype html><html lang="es"><meta charset="utf-8"><title>Alloy · propuestas mezcla</title>
<style>
html,body{margin:0;background:#0b0b0d;color:#9a958b;font:14px system-ui}
h1{font-size:18px;text-align:center;margin:18px 0 4px;color:#e8e3d8}p.s{text-align:center;margin:0 0 14px}
#g{display:grid;grid-template-columns:repeat(2,minmax(280px,380px));gap:26px 40px;justify-content:center;padding:10px 20px 40px}
.card{text-align:center}.card canvas{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 8px #1a1a1d;cursor:pointer}
.card b{display:block;color:#e8e3d8;margin:12px 0 2px;font-size:16px}.card span{font-size:13px}
@media(max-width:800px){#g{grid-template-columns:1fr}}
</style>
<h1>Propuestas · mezcla de todo (tinta + WALL·E/EVE + caricatura + criaturas)</h1>
<p class="s">mouse = te miran · <b>clic = criatura nueva</b> (otra forma, otros colores) · cada una cambia de emoción sola</p>
<div id="g"></div>
<script>
const R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.random()*a.length|0];
const S=(x=0)=>({x,v:0,t:x});const st=(s,dt,k,d)=>{s.v+=((s.t-s.x)*k-s.v*d)*dt;s.x+=s.v*dt};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mixc=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const now=()=>performance.now()/1000;
let seed=1;const rn=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5};
let boil=0;const wob=(i,a)=>{const x=Math.sin(boil*12.9898+i*78.233)*43758.5453;return (x-Math.floor(x)-.5)*2*a};
const KEYS=['rx','ryT','ryB','n','sh','tl','ps','cy'];
const PAL_NEON=['#4de3ff','#7dff6a','#ff9f3d','#ff5fa2','#b48cff','#ffe14d','#ff5a4d','#2effc0','#5b8cff','#ff8ad8'].map(hex);
const PAL_INK=['#1f8f9e','#c2185b','#e07b00','#3a8a2a','#6a3fb5','#c0392b','#1b5fb0'].map(hex);
// ---------- formas (genoma por ojo) ----------
const oval=(a=1)=>({rx:R(20,30)*a,ryT:R(25,36)*a,ryB:R(24,38)*a,n:R(2,2.8),sh:R(-6,6),tl:R(-8,8),ps:R(.85,1.15),cy:R(-4,4)});
const PRE=[ // formas deformadas tipo caricatura
 {rx:30,ryT:27,ryB:6,n:2.1,sh:0,tl:0},{rx:33,ryT:25,ryB:21,n:1.55,sh:11,tl:-4},{rx:36,ryT:12,ryB:12,n:4,sh:0,tl:2},
 {rx:32,ryT:26,ryB:10,n:1.5,sh:-12,tl:5},{rx:27,ryT:35,ryB:30,n:2.2,sh:0,tl:0},{rx:34,ryT:22,ryB:28,n:1.7,sh:-9,tl:-6}];
const cart=()=>{const p=P(PRE),j=()=>R(1.15,1.35);return{rx:p.rx*j(),ryT:p.ryT*j(),ryB:p.ryB*j(),n:p.n,sh:p.sh*R(.7,1.2),tl:p.tl+R(-4,4),ps:R(.9,1.1),cy:R(-3,3)}};
function creature(T){
  const A=T.gen();let B=T.gen();const m=Math.random();
  if(m<.45)B={...A,sh:-A.sh,tl:-A.tl,cy:-A.cy*.5};else if(m<.65){B.rx=A.rx*R(.72,.88);B.ryT=A.ryT*R(.72,.88);B.ryB=A.ryB*R(.72,.88)}
  const c1=P(T.pal);let c2=c1;if(Math.random()<.4)c2=P(T.pal);
  return{A,B,gap:R(72,92),pd:R(-1,1),cA:[...c1],cB:[...c2]}
}
function shapeP(rx,ryT,ryB,n,sh,id,amp){
  const p=[],N=44;for(let i=0;i<N;i++){const a=i/N*6.2832,co=Math.cos(a),si=Math.sin(a),e=2/n,ry=si<0?ryT:ryB;
    let x=rx*Math.sign(co)*Math.pow(Math.abs(co),e)+wob(id*60+i,amp),y=ry*Math.sign(si)*Math.pow(Math.abs(si),e)+wob(id*60+i+99,amp);
    x+=sh*(y/Math.max(ryT,1));p.push([x,y])}
  return p
}
const path=(g,p)=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath()};
// ---------- pestañas (flicks gruesos que terminan en punta) ----------
function lashes(g,rx,ryT,out,o,color,n,len){
  g.fillStyle=color;const bx=out*rx*.72,by=-ryT*.62;
  for(let i=0;i<n;i++){const a=(-18-i*(70/Math.max(1,n-1)))*.01745,L=(len-i*2.2)*(.55+.45*Math.min(o,1)),dx=out*Math.cos(a),dy=Math.sin(a);
    const ox=bx+out*i*1.5,oy=by-i*3;g.beginPath();g.moveTo(ox,oy-2.8);g.quadraticCurveTo(ox+dx*L*.6,oy+dy*L*.6-3,ox+dx*L,oy+dy*L);g.quadraticCurveTo(ox+dx*L*.55,oy+dy*L*.5+2,ox,oy+3);g.closePath();g.fill()}
}
// ---------- ojo genérico, cada propuesta cambia solo el "estilo" ----------
function eyeDraw(s,side,cx,e,col,id,o,gX,gY,br){
  const T=s.theme,g=s.g,out=side?1:-1,C=rgb(col);o=Math.max(0,Math.min(1.1,o));
  const hp=s.hp.x,dr=s.dr.x,op=o*(1-.3*hp)*(1-.35*dr),k=s.pop.x*(1+s.sur.x*.12+(side?-1:1)*s.cur.x*.13),vel=Math.hypot(s.gx.v,s.gy.v),stx=1+Math.min(.14,vel*.0035);
  const rx=e.rx*k*(1+(1-Math.min(o,1))*.3)/Math.sqrt(stx),f=(.06+.94*op)*stx*k,ryT=e.ryT*f,ryB=e.ryB*f,cy=126+e.cy;
  g.save();g.translate(cx+gX*.9,cy+gY*.9+(e.ryT-ryT)*.4);g.rotate((e.tl+s.cur.x*out*5)*.01745);
  g.lineJoin='round';g.lineCap='round';
  const sp=shapeP(rx,ryT,ryB,e.n,e.sh,id,T.amp);
  path(g,sp);g.fillStyle=T.fill(col);g.fill();
  g.save();g.clip();
  if(op>.15){
    if(T.pupil==='giant'){
      const prx=rx*.5*e.ps*s.pup.x,pry=(ryT+ryB)*.4*s.pup.x,lim=rx*.42,
        px=Math.max(-lim,Math.min(lim,s.pd*rx*.28+gX*.8)),py=gY*.7+(ryB-ryT)*.1;
      g.beginPath();g.ellipse(px,py,prx,pry,0,0,6.3);g.fillStyle=T.pupC;g.fill();
      if(T.shine){g.fillStyle='#fff';g.beginPath();g.roundRect(px-prx*.38-2.5,py-pry*.55,5,pry*.75,2.5);g.fill();g.beginPath();g.arc(px+prx*.3,py+pry*.45,2.4,0,6.3);g.fill()}
    }else{
      const px=gX*.45,py=gY*.45,ir=Math.min(rx*.66*e.ps*s.pup.x,rx-5),iy=Math.min(Math.max(ryT,ryB)*.72*e.ps*s.pup.x,Math.min(ryT,ryB)-3);
      g.beginPath();g.ellipse(px,py+(ryB-ryT)*.1,ir,iy,0,0,6.3);g.fillStyle=T.iris(col);g.fill();g.lineWidth=T.lw*.7;g.strokeStyle=T.irisLine(col);g.stroke();
      g.beginPath();g.ellipse(px,py+(ryB-ryT)*.1,ir*.5,iy*.52,0,0,6.3);g.fillStyle=T.pupC;g.fill();
      g.beginPath();g.ellipse(px-ir*.3,py-iy*.35,Math.max(2.8,ir*.2),Math.max(3.2,iy*.2),-.3,0,6.3);g.fillStyle=T.hi;g.fill()}
  }
  // párpado: cae al parpadear, con sueño y con la inclinación de la emoción; en caricatura lleva "gorrito" de color
  const H=ryT+ryB,yL=-ryT+H*(T.lidBase+(1-T.lidBase)*Math.max(0,.08-(op-1)*0))+dr*H*.2,sl=-s.tilt.x*.42*(-out)*-1;
  const lidY=x=>yL+sl*x*(-out)*-1*1;
  g.beginPath();g.moveTo(-70,-90);g.lineTo(70,-90);g.lineTo(70,lidY(70));g.lineTo(-70,lidY(-70));g.closePath();g.fillStyle=T.lid(col);g.fill();
  g.beginPath();g.moveTo(-70,lidY(-70));g.lineTo(70,lidY(70));g.lineWidth=T.lw*.8;g.strokeStyle=T.edge(col);g.stroke();
  if(hp>.05){g.beginPath();g.ellipse(0,ryB+10,rx*1.3,hp*(H*.58),0,0,6.3);g.fillStyle=T.bg;g.fill();g.lineWidth=T.lw*.8;g.strokeStyle=T.edge(col);g.stroke()}
  g.restore();
  path(g,shapeP(rx,ryT,ryB,e.n,e.sh,id,T.amp));g.lineWidth=T.lw;g.strokeStyle=T.line(col);g.stroke();
  if(T.lashN)lashes(g,rx,ryT,out,o,T.lash(col),T.lashN,T.lashLen);
  if(op>.45&&T.brow){const b=br*9;g.beginPath();for(let i=0;i<=12;i++){const u=i/12,x=(u*2-1)*rx*.95,inn=-out*x,y=-ryT-T.browY-b+s.gy.x*.2-Math.sin(Math.PI*u)*T.browArc-s.tilt.x*inn*.42-(u-.5)*0;i?g.lineTo(x,y):g.moveTo(x,y)}
    g.lineWidth=T.browW;g.strokeStyle=T.browC(col);g.stroke()}
  g.restore()
}
// ---------- motor (resortes, parpadeo, miradas, emociones, criaturas) ----------
function Face(title,desc,T){
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<canvas width="480" height="480"></canvas><b>${title}</b><span>${desc}</span>`;document.getElementById('g').appendChild(card);
  const c=card.querySelector('canvas'),g=c.getContext('2d');g.scale(2,2);
  const s={g,theme:T,gx:S(),gy:S(),oL:S(1),oR:S(1),hp:S(),tilt:S(),cur:S(),sur:S(),dr:S(),pop:S(1),pup:S(1),t:0};
  const tgt=creature(T),cur={A:{...tgt.A},B:{...tgt.B},gap:tgt.gap,cA:[...tgt.cA],cB:[...tgt.cB]};let pd=tgt.pd;
  let mouse=null,E={b:1.5,sc:1,m:4,sl:15,u:0};
  const look=(x,y)=>{s.gx.t=x;s.gy.t=y};
  const blink=()=>{s.oL.t=s.oR.t=1.08;setTimeout(()=>s.oL.t=0,50);setTimeout(()=>s.oR.t=0,90);setTimeout(()=>s.oL.t=1,240);setTimeout(()=>s.oR.t=1,270)};
  const reset=()=>{s.hp.t=s.tilt.t=s.cur.t=s.sur.t=s.dr.t=0;s.pup.t=1;look(0,0)};
  function mood(k){k=k||P(['feliz','triste','enojado','curioso','sorpresa','feliz','curioso','enojado']);
    if(k==='feliz'){s.hp.t=1;s.pop.v+=3}if(k==='triste'){s.tilt.t=1;s.dr.t=.5;look(0,6)}if(k==='enojado'){s.tilt.t=-1;s.pup.t=.8}
    if(k==='curioso'){const d=Math.random()<.5?-1:1;s.cur.t=d;look(d*14,-4)}if(k==='sorpresa'){s.sur.t=1;s.pup.t=.6;s.pop.v+=4}
    setTimeout(reset,2000);E.u=s.t+2.2}
  function slow(){E.u=s.t+2.6;s.oL.t=s.oR.t=0;[.6,1.2,1.8].forEach(d=>setTimeout(()=>look(R(-14,14),R(-7,7)),d*1000));setTimeout(()=>{look(0,0);s.oL.t=1;setTimeout(()=>s.oR.t=1,60);s.pop.v+=2},2200)}
  function fresh(){const n=creature(T);tgt.A=n.A;tgt.B=n.B;tgt.gap=n.gap;tgt.cA=n.cA;tgt.cB=n.cB;pd=n.pd;s.pop.v-=7;setTimeout(()=>s.pop.v+=9,100)}
  let last=now();
  (function f(){
    const n=now(),dt=Math.min(.033,n-last);last=n;s.t+=dt;const t=s.t;boil=Math.floor(t*10);
    if(t>E.b&&t>E.u){blink();if(Math.random()<.2)setTimeout(blink,330);E.b=t+2+Math.random()*3.4}
    if(t>E.sl){slow();E.sl=t+26+Math.random()*16}
    if(t>E.m&&t>E.u&&!mouse){Math.random()<.2?fresh():mood();E.m=t+5+Math.random()*5}
    if(!mouse&&t>E.sc&&t>E.u){Math.random()<.3?look(0,0):look(R(-15,15),R(-9,9));E.sc=t+1.3+Math.random()*2.6}
    if(mouse)look(mouse.x*16,mouse.y*11);
    st(s.gx,dt,150,9);st(s.gy,dt,150,9);st(s.oL,dt,520,28);st(s.oR,dt,520,28);[s.hp,s.tilt,s.cur,s.sur,s.dr,s.pup].forEach(q=>st(q,dt,90,9));st(s.pop,dt,170,10);
    KEYS.forEach(k=>{cur.A[k]+=(tgt.A[k]-cur.A[k])*.1;cur.B[k]+=(tgt.B[k]-cur.B[k])*.1});cur.gap+=(tgt.gap-cur.gap)*.1;
    for(let i=0;i<3;i++){cur.cA[i]+=(tgt.cA[i]-cur.cA[i])*.1;cur.cB[i]+=(tgt.cB[i]-cur.cB[i])*.1}
    s.pd=pd;T.bgDraw(g);
    g.save();g.translate(Math.sin(t*.6)*1.4,Math.sin(t*1.7)*1.3);
    eyeDraw(s,0,120-cur.gap/2,cur.A,cur.cA,1,s.oL.x,s.gx.x,s.gy.x,s.hp.x*0+s.cur.x>0?1:0);
    eyeDraw(s,1,120+cur.gap/2,cur.B,cur.cB,2,s.oR.x,s.gx.x-s.gx.v*.012,s.gy.x-s.gy.v*.012,s.cur.x<0?1:0);
    g.restore();requestAnimationFrame(f)
  })();
  c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse={x:((e.clientX-r.left)/r.width-.5)*2,y:((e.clientY-r.top)/r.height-.5)*2}});
  c.addEventListener('mouseleave',()=>{mouse=null;reset()});c.addEventListener('click',fresh);
}
const black=g=>{g.fillStyle='#050506';g.fillRect(0,0,240,240)};
const none='rgba(0,0,0,0)';
// 1 · Pestañas de tinta: contorno de color sobre negro, iris lleno, pestañas y ceja finas
Face('1 · Pestañas de tinta','Línea de color sobre negro con temblor de lápiz, iris relleno de color, pestañas y ceja. Mezcla de la hoja de tinta con tus criaturas asimétricas.',
 {gen:()=>oval(),pal:PAL_NEON,bgDraw:black,bg:'#050506',amp:.7,lw:5.5,fill:c=>rgb(c,.1),line:c=>rgb(c),pupil:'ring',pupC:'#040404',iris:c=>rgb(mixc(c,[0,0,0],.7)),irisLine:c=>rgb(c),hi:'#f6f6ee',
  lidBase:0,lid:()=>'#050506',edge:c=>rgb(c),lashN:3,lashLen:17,lash:c=>rgb(c),brow:true,browY:14,browArc:4,browW:3,browC:c=>rgb(c,.7)});
// 2 · Pupila gigante: ojo de color con formas deformadas (domo, limón, barra, cuña) y pupila enorme descentrada
Face('2 · Pupila gigante','Formas deformadas de la hoja neoneons (domo, limón, barra, cuña) en color liso, con pupila negra enorme que se corta con el borde.',
 {gen:cart,pal:PAL_NEON,bgDraw:black,bg:'#050506',amp:.5,lw:6,fill:c=>rgb(c),line:()=>'#000',pupil:'giant',pupC:'#050505',shine:false,
  lidBase:0,lid:c=>rgb(mixc(c,[0,0,0],.0)),edge:()=>'#000',lashN:0,brow:false});
// 3 · Párpado de color: ojo blanco con gorrito de color, pestañas y cejas gruesas (caricatura)
Face('3 · Párpado de color','Ojo blanco de caricatura con pupila grande y brillo, párpado de color como gorrito, pestañas y cejas gruesas que cambian la emoción.',
 {gen:()=>oval(.95),pal:PAL_NEON,bgDraw:black,bg:'#050506',amp:.5,lw:6,fill:()=>'#f6f3ea',line:()=>'#000',pupil:'giant',pupC:'#040404',shine:true,
  lidBase:.3,lid:c=>rgb(c),edge:()=>'#000',lashN:3,lashLen:18,lash:c=>rgb(c),brow:true,browY:12,browArc:6,browW:5,browC:()=>'#f6f3ea'});
// 4 · Cuaderno: pantalla de papel con ojos de tinta negra y un solo acento de color
Face('4 · Cuaderno','Identidad radical: la pantalla es papel y los ojos son tinta negra con un solo acento de color en el iris, pestañas gruesas y ceja de pincel.',
 {gen:()=>oval(1.02),pal:PAL_INK,bgDraw:g=>{const r=g.createRadialGradient(120,110,40,120,120,150);r.addColorStop(0,'#ecdcb6');r.addColorStop(1,'#cdb98a');g.fillStyle=r;g.fillRect(0,0,240,240)},
  bg:'#e4d3aa',amp:.9,lw:4.6,fill:()=>none,line:()=>'#16110d',pupil:'ring',pupC:'#16110d',iris:c=>rgb(c),irisLine:()=>'#16110d',hi:'#ecdcb6',
  lidBase:0,lid:()=>'#e0cfa4',edge:()=>'#16110d',lashN:3,lashLen:19,lash:()=>'#16110d',brow:true,browY:15,browArc:5,browW:4.2,browC:()=>'#16110d'});
</script></html>
