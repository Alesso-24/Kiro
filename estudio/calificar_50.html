<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiro · calificar 50 criaturas base</title>
<style>
:root{--bg:#0b0b0d;--panel:#131317;--line:#24242b;--tx:#e8e3d8;--mut:#8f8a80;--ok:#4de3a0;--no:#ff5a6a;--ac:#4de3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0b0dee;backdrop-filter:blur(6px);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px}header .c{color:var(--mut)}header .c b{color:var(--tx)}
button.big{background:var(--ac);color:#04161a;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}button.big.sec{background:#1b1b21;color:var(--tx);border:1px solid var(--line)}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;transition:.15s}
.card.ok{border-color:var(--ok)}.card.no{border-color:var(--no);opacity:.75}
.card canvas{width:100%;aspect-ratio:1;border-radius:50%;background:#050506;display:block}
.n{color:var(--mut);font-size:12px;margin:6px 0}
.b{display:flex;gap:8px;justify-content:center}.b button{flex:1;border:1px solid var(--line);background:#1b1b21;color:var(--tx);border-radius:10px;padding:8px 0;font:inherit;font-size:15px;cursor:pointer}
.b button:hover{border-color:#44444f}.card.ok .y{background:var(--ok);color:#052014;border-color:var(--ok)}.card.no .x{background:var(--no);color:#2a0409;border-color:var(--no)}
#out{display:none;max-width:900px;margin:20px auto;padding:0 20px 60px}#out textarea{width:100%;height:220px;background:#101014;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace}
</style>
<header><h1>Calificar 50 criaturas base</h1><span class="c">👍 <b id="ny">0</b> · 👎 <b id="nn">0</b> · sin calificar <b id="nr">50</b></span>
<button class="big" id="fin">Terminar y guardar</button><select id="forma" style="background:#1b1b21;color:#e8e3d8;border:1px solid #24242b;border-radius:10px;padding:8px"><option value="suave">Ojos: irregulares suaves (como antes)</option><option value="exo">Ojos: exóticos</option></select><select id="pup" style="background:#1b1b21;color:#e8e3d8;border:1px solid #24242b;border-radius:10px;padding:8px"><option value="suave">Pupilas: suaves (alta/redonda)</option><option value="irr">Pupilas: irregulares</option><option value="exo">Pupilas: exóticas con picos</option></select><select id="modo" style="background:#1b1b21;color:#e8e3d8;border:1px solid #24242b;border-radius:10px;padding:8px"><option value="casi">Ojos casi iguales · pupilas iguales</option><option value="igual">Ojos iguales · pupilas iguales</option><option value="parejos">Iguales o casi iguales</option><option value="libres">Libres (como antes)</option></select><button class="big sec" id="again">Generar otras 50</button><span class="c">Atajos: pasa el mouse sobre una y pulsa <b>Y</b> (me gusta) / <b>N</b> (no) / <b>0</b> (quitar)</span></header>
<div id="g"></div>
<div id="out"><p>Listo. Se descargó <b>calificacion_criaturas.json</b> en tu carpeta de Descargas. También puedes copiar esto y pegármelo:</p><textarea id="ta" readonly></textarea></div>
<script>
const R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.random()*a.length|0],TAU=Math.PI*2,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const NEON=['#4de3ff','#7dff6a','#ff9f3d','#ff5fa2','#b48cff','#ffe14d','#ff5a4d','#2effc0','#5b8cff','#ff8ad8'];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
// ---- mismo generador del Estudio v4 ----
function genEyeExo(){const crest=Math.random()<.78;return[R(30,52),R(32,58),R(.05,.42),R(-2.35,-.75),crest?R(.12,.6):R(0,.12),R(.16,.5),crest?R(.2,1.05):R(0,.25),R(.028,.058),R(-.5,.5),R(-.8,.8),Math.random()<.35?R(.1,.32):0,R(-8,8)]}
function mirrorExo(a){const b=a.slice();b[3]=-Math.PI-a[3];b[8]=-a[8];b[9]=-a[9];b[11]=-a[11];return b}
function jitEye(a,k){return a.map((v,i)=>i===3?v+R(-.12,.12)*k:i===11?v+R(-2,2)*k:v*(1+R(-.07,.07)*k))}
let MODO='casi';
function genPair(){const gen=FORMA==='exo'?genEyeExo:genEyeSoft,A=gen(),m=Math.random();let B,mode;
  if(MODO==='igual'){mode='iguales';B=A.slice()}
  else if(MODO==='casi'){mode='casi iguales';B=jitEye(A,1)}
  else if(MODO==='parejos'){if(m<.5){mode='iguales';B=A.slice()}else{mode='casi iguales';B=jitEye(A,1)}}
  else if(m<.32){mode='espejo';B=mirrorExo(A).map((v,k)=>v*(k<2?R(.94,1.06):1))}
  else if(m<.58){mode='parecido';B=A.map((v,k)=>k===3||k===11?v+R(-.35,.35):v*R(.84,1.16))}
  else{mode='distinto';B=gen()}
  return{eyes:[A,B],mode}}
function genPupExo(eye){const q=(Math.random()<.5&&eye)?eye.map((v,k)=>k===3||k===11?v+R(-.3,.3):v*R(.8,1.2)):genEyeExo();q[4]*=.65;q[6]*=.55;return q}
function genPup(){const r=Math.random();let q;
  if(r<.22)q={fx:R(.38,.5),fy:R(.38,.5),a:R(.01,.07)};
  else if(r<.40)q={fx:R(.33,.43),fy:R(.56,.74),a:R(.02,.1)};
  else if(r<.72)q={fx:R(.54,.68),fy:R(.5,.64),a:R(.08,.2)};
  else if(r<.84)q={fx:R(.58,.7),fy:R(.34,.45),a:R(.04,.12)};
  else q={fx:R(.4,.55),fy:R(.42,.58),a:R(.12,.2)};
  q.p2=R(0,6.3);q.p3=R(0,6.3);q.p4=R(0,6.3);q.sk=R(-.22,.22);return q}
function pupPath(g,rx,ry,q,t){rx=Math.max(.6,rx);ry=Math.max(.6,ry);const N=44;g.beginPath();
  for(let i=0;i<N;i++){const a=i/N*TAU,r=1+q.a*(.6*Math.sin(2*a+q.p2+t*.5)+.8*Math.sin(3*a+q.p3-t*.4)+.5*Math.sin(4*a+q.p4+t*.3)),x=Math.cos(a)*rx*r+q.sk*Math.sin(a)*ry,y=Math.sin(a)*ry*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}
function genEyeSoft(){const crest=Math.random()<.25;return[R(36,46),R(42,52),R(.08,.22),R(-2.0,-1.1),crest?R(.1,.28):0,R(.2,.4),crest?R(.15,.4):0,R(.03,.05),R(-.15,.15),R(-.25,.25),0,R(-4,4)]}
function genPupSoft(){const tall=Math.random()<.5,j=R(.95,1.05);return tall?{fx:.5*j,fy:.6*j,a:R(.01,.05),p2:R(0,6.3),p3:R(0,6.3),p4:R(0,6.3),sk:R(-.06,.06)}:{fx:.42*j,fy:.42*j,a:R(.01,.05),p2:R(0,6.3),p3:R(0,6.3),p4:R(0,6.3),sk:R(-.05,.05)}}
let FORMA='suave',PUP='suave';
let seed=1,WOB=1;
function outline(p,t,id,sx,sy){
  const [rx,ry,flat,ca,ch,cw,th,tw,lean,hook,notch]=p,pts=[],n=80;
  for(let i=0;i<n;i++){const a=i/n*TAU;let r=1+(.028*Math.sin(3*a+t*1.3+id*2)+.022*Math.sin(5*a-t*.9+id)+.015*Math.sin(2*a+t*.7))*WOB;
    const d=Math.atan2(Math.sin(a-ca),Math.cos(a-ca)),d2=Math.atan2(Math.sin(a-ca-hook*.5),Math.cos(a-ca-hook*.5));
    r+=ch*Math.exp(-d*d/Math.max(.02,cw))+th*.6*Math.exp(-d2*d2/Math.max(.01,tw))*(1+Math.sin(t*2.3+id)*.07);
    if(notch>0){const dn=Math.atan2(Math.sin(a-ca-.55),Math.cos(a-ca-.55));r-=notch*Math.exp(-dn*dn/.02)}
    let x=Math.cos(a)*rx*r,y=Math.sin(a)*ry*r;if(y>0)y=ry*Math.pow(Math.sin(a),1-flat*.7)*r;
    x+=-y*lean*.55;pts.push([x*sx,y*sy])}
  return pts}
const path=(g,p)=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath()};
function newCreature(){
  const pr=genPair(),c1=hex(P(NEON)),c2=hex(P(NEON));
  const two=Math.random()<.2,mir=Math.random()<.5,sc=R(.98,1.08),pd=R(-1,1);
  const gap=Math.min(150,Math.max(R(112,122),(pr.eyes[0][0]+pr.eyes[1][0])*sc*1.13+8));   // ojos grandes no se pegan
  const gp=PUP==='suave'?genPupSoft:PUP==='irr'?genPup:null;
  let pupx=PUP==='exo'?[genPupExo(pr.eyes[0]),genPupExo(pr.eyes[1])]:[gp(),gp()],pupk=PUP==='exo'?[R(.38,.6),R(.38,.6)]:[0,0];
  if(MODO!=='libres'){pupx=[pupx[0],PUP==='exo'?pupx[0].slice():{...pupx[0]}];pupk=[pupk[0],pupk[0]]}   // pupilas irregulares iguales en los dos ojos
  return{c1,c2,two,mir,sc,gap,pd,eyes:pr.eyes,modo:pr.mode,pupx,pupk,gene:[R(.9,1.1),R(.9,1.1)],ph:[R(0,6.3),R(0,6.3)],score:0}
}
function draw(c,cv,t){
  const g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='#050506';g.fillRect(0,0,cv.width,cv.height);g.scale(cv.width/240,cv.width/240);
  for(let side=0;side<2;side++){
    const out=side?1:-1,p=c.eyes[side],col=(side&&c.two)?c.c2:c.c1,k=c.sc*c.gene[side],flip=(c.mir&&side)?-1:1,f=1+Math.sin(t*1.6+c.ph[side])*.012;
    g.save();g.translate(120+out*c.gap/2,134+Math.sin(t*1.7)*1.2);if(flip<0)g.scale(-1,1);g.rotate(p[11]*.01745);
    const pts=outline(p,t,side,k,k*f);path(g,pts);g.fillStyle=rgb(col);g.fill();
    g.save();path(g,pts);g.clip();
    const lim=p[0]*.38,px=cl((c.pd*p[0]*.2)*flip,-lim,lim)+Math.sin(t*.9+c.ph[side])*1.6,py=p[1]*.12+Math.cos(t*1.1+c.ph[side])*1.2,q=c.pupx[side];
    g.translate(px,py);if(Array.isArray(q)){const kx=p[0]*c.pupk[side]/q[0],ky=p[1]*c.pupk[side]/q[1];g.rotate(q[11]*.01745);path(g,outline(q,t,side+7,kx,ky))}else pupPath(g,p[0]*q.fx,p[1]*q.fy,q,t);g.fillStyle=rgb(mix(col,[0,0,0],.86));g.fill();
    g.restore();g.restore()}
}
let cs=[],cvs=[];
function build(){
  const G=document.getElementById('g');G.innerHTML='';cs=[];cvs=[];
  for(let i=0;i<50;i++){const c=newCreature();cs.push(c);
    const d=document.createElement('div');d.className='card';d.dataset.i=i;
    d.innerHTML=`<canvas width="360" height="360"></canvas><div class="n">#${i+1} · ojos ${c.modo}${c.two?' · 2 colores':''}</div><div class="b"><button class="y">👍 Me gusta</button><button class="x">👎 No</button></div>`;
    G.appendChild(d);cvs.push(d.querySelector('canvas'));
    d.querySelector('.y').onclick=()=>setScore(i,c.score===1?0:1);d.querySelector('.x').onclick=()=>setScore(i,c.score===-1?0:-1);
    d.addEventListener('mouseenter',()=>hov=i);d.addEventListener('mouseleave',()=>hov=-1)}
  count()}
let hov=-1;
function setScore(i,s){cs[i].score=s;const d=document.querySelector(`.card[data-i="${i}"]`);d.classList.toggle('ok',s===1);d.classList.toggle('no',s===-1);count()}
function count(){const y=cs.filter(c=>c.score===1).length,n=cs.filter(c=>c.score===-1).length;document.getElementById('ny').textContent=y;document.getElementById('nn').textContent=n;document.getElementById('nr').textContent=50-y-n}
addEventListener('keydown',e=>{if(hov<0)return;const k=e.key.toLowerCase();if(k==='y')setScore(hov,1);if(k==='n')setScore(hov,-1);if(k==='0')setScore(hov,0)});
const doNew=()=>{if(cs.some(c=>c.score)&&!confirm('Se perderán las calificaciones actuales. ¿Generar otras 50?'))return false;MODO=document.getElementById('modo').value;FORMA=document.getElementById('forma').value;PUP=document.getElementById('pup').value;build();return true};
document.getElementById('again').onclick=doNew;['modo','forma','pup'].forEach(id=>document.getElementById(id).onchange=()=>{if(!doNew()){document.getElementById('modo').value=MODO;document.getElementById('forma').value=FORMA;document.getElementById('pup').value=PUP}});
document.getElementById('fin').onclick=()=>{
  const r=cs.map((c,i)=>({n:i+1,calificacion:c.score===1?'me gusta':c.score===-1?'no':'sin calificar',forma_ojos:FORMA,tipo_pupila:PUP,modo_ojos:c.modo,dos_colores:c.two,espejo:c.mir,ojoA:c.eyes[0].map(v=>+v.toFixed(3)),ojoB:c.eyes[1].map(v=>+v.toFixed(3)),pupilaA:c.pupx[0],pupilaB:c.pupx[1],pupk:c.pupk,escala:+c.sc.toFixed(3),separacion:+c.gap.toFixed(1),pupila_desplazada:+c.pd.toFixed(2),color1:c.c1,color2:c.c2}));
  const txt=JSON.stringify(r,null,1);document.getElementById('ta').value=txt;document.getElementById('out').style.display='block';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='calificacion_criaturas.json';a.click();
  navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{});scrollTo(0,document.body.scrollHeight)};
let last=0;function loop(ms){const t=ms/1000;if(ms-last>66){last=ms;cs.forEach((c,i)=>draw(c,cvs[i],t))}requestAnimationFrame(loop)}
build();requestAnimationFrame(loop);
</script></html>
